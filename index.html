<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Stay Classifier — Room Type Predictor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <!-- LEFT: identity panel -->
  <aside class="rail">
    <div class="rail-top">
      <div class="mark">NYC</div>
      <h1>Stay<br>Classifier</h1>
      <p class="rail-copy">
        Enter a listing's details and the model predicts whether it lists
        as an entire home, a private room, or a shared room — trained on
        NYC Airbnb listing data.
      </p>
    </div>

    <div class="borough-key">
      <span class="key-label">Boroughs</span>
      <ul id="boroughKey" class="key-list"><!-- filled by JS --></ul>
    </div>

    <div class="rail-bottom">
      <span class="endpoint-label">API endpoint</span>
      <span class="endpoint-hint">Set in <code>script.js</code> as <code>API_URL</code></span>
    </div>
  </aside>

  <!-- RIGHT: form + results -->
  <main class="stage">

    <form id="predictForm" class="card" autocomplete="off">

      <div class="card-head">
        <h2>Listing details</h2>
        <span class="card-head-sub">10 fields</span>
      </div>

      <div class="grid">

        <div class="field">
          <label for="latitude">Latitude</label>
          <input id="latitude" name="latitude" type="number" step="any"
                 min="-90" max="90" placeholder="40.7128" required>
        </div>

        <div class="field">
          <label for="longitude">Longitude</label>
          <input id="longitude" name="longitude" type="number" step="any"
                 min="-180" max="180" placeholder="-74.0060" required>
        </div>

        <div class="field">
          <label for="price">Price / night ($)</label>
          <input id="price" name="price" type="number" step="any"
                 min="0.01" placeholder="150" required>
        </div>

        <div class="field">
          <label for="minimum_nights">Minimum nights</label>
          <input id="minimum_nights" name="minimum_nights" type="number" step="1"
                 min="1" max="365" placeholder="3" required>
        </div>

        <div class="field">
          <label for="number_of_reviews">Number of reviews</label>
          <input id="number_of_reviews" name="number_of_reviews" type="number" step="1"
                 min="0" placeholder="24" required>
        </div>

        <div class="field">
          <label for="reviews_per_month">Reviews per month</label>
          <input id="reviews_per_month" name="reviews_per_month" type="number" step="any"
                 min="0" placeholder="1.2" required>
        </div>

        <div class="field">
          <label for="calculated_host_listings_count">Host's total listings</label>
          <input id="calculated_host_listings_count" name="calculated_host_listings_count"
                 type="number" step="1" min="0" placeholder="2" required>
        </div>

        <div class="field">
          <label for="availability_365">Available days / year</label>
          <input id="availability_365" name="availability_365" type="number" step="1"
                 min="0" max="365" placeholder="180" required>
        </div>

        <div class="field">
          <label for="neighbourhood_group">Borough</label>
          <select id="neighbourhood_group" name="neighbourhood_group" required>
            <option value="" disabled selected>Choose a borough</option>
          </select>
        </div>

        <div class="field">
          <label for="neighbourhood">Neighbourhood</label>
          <input id="neighbourhood" name="neighbourhood" type="text"
                 list="neighbourhoodList" placeholder="Start typing…" required>
          <datalist id="neighbourhoodList"></datalist>
        </div>

      </div>

      <div class="card-foot">
        <button type="submit" id="submitBtn" class="btn-predict">
          <span class="btn-text">Predict room type</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
        <span id="formError" class="form-error" role="alert"></span>
      </div>
    </form>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <span class="result-label">Prediction</span>
        <h2 id="resultType">—</h2>
      </div>
      <div id="probBars" class="prob-bars"><!-- filled by JS --></div>
    </section>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
